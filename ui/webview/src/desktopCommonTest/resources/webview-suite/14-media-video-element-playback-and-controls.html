  <section id="suite-results"></section>

  <script>
  (function (root) {
    var isStandalone = (typeof root.describe !== "function");
    var suites = [], activeSuite = null;
    function fv(v) { try { return JSON.stringify(v); } catch (e) { return String(v); } }
    function ext(m, a) {
      if (typeof m.toBeLessThanOrEqual !== "function") m.toBeLessThanOrEqual = function (n) { if (!(a <= n)) throw new Error("Expected " + a + " <= " + n); };
      if (typeof m.toBeCloseTo !== "function") m.toBeCloseTo = function (e, p) { var tol = Math.pow(10, -(typeof p === "number" ? p : 2)) / 2; if (Math.abs(a - e) >= tol) throw new Error("Expected " + a + " ~= " + e); };
      if (typeof m.toThrow !== "function") m.toThrow = function () { var ok = false; try { a(); } catch (e) { ok = true; } if (!ok) throw new Error("Expected throw"); };
      return m;
    }
    if (typeof root.expect === "function") { var oe = root.expect; root.expect = function (a) { return ext(oe(a), a); }; }
    else {
      root.expect = function (a) {
        return ext({
          toBe: function (e) { if (a !== e) throw new Error("Expected " + fv(e) + " got " + fv(a)); },
          toEqual: function (e) { if (fv(a) !== fv(e)) throw new Error("Expected " + fv(e) + " == " + fv(a)); },
          toBeTruthy: function () { if (!a) throw new Error("Expected truthy"); },
          toBeFalsy: function () { if (a) throw new Error("Expected falsy"); },
          toBeNull: function () { if (a != null) throw new Error("Expected null"); },
          toBeDefined: function () { if (a === undefined) throw new Error("Expected defined"); },
          toContain: function (i) { if (String(a).indexOf(String(i)) < 0) throw new Error("Expected contain " + i); },
          toBeGreaterThan: function (n) { if (!(a > n)) throw new Error("Expected " + a + " > " + n); },
          toBeGreaterThanOrEqual: function (n) { if (!(a >= n)) throw new Error("Expected " + a + " >= " + n); },
          toBeLessThan: function (n) { if (!(a < n)) throw new Error("Expected " + a + " < " + n); }
        }, a);
      };
    }
    if (isStandalone) {
      root.describe = function (n, fn) { var s = { name: n, tests: [] }; suites.push(s); activeSuite = s; fn(); activeSuite = null; };
      root.it = function (n, fn) { (activeSuite || suites[0]).tests.push({ name: n, fn: fn }); };
      root.test = root.it;
      root.addEventListener("load", function () {
        var c = document.getElementById("suite-results"), sum = { suite: document.title, total: 0, passed: 0, failed: 0, failures: [] };
        var q = [];
        for (var i = 0; i < suites.length; i++) for (var j = 0; j < suites[i].tests.length; j++) (function (tc) {
          q.push(function () {
            sum.total++; var row = document.createElement("div"); c.appendChild(row);
            try {
              var r = tc.fn();
              if (r && typeof r.then === "function") return r.then(function () { sum.passed++; row.className = "suite-row suite-pass"; row.textContent = "[PASS] " + tc.name; }, function (e) { sum.failed++; sum.failures.push({ test: tc.name, error: e.message }); row.className = "suite-row suite-fail"; row.textContent = "[FAIL] " + tc.name + " — " + e.message; });
              sum.passed++; row.className = "suite-row suite-pass"; row.textContent = "[PASS] " + tc.name;
            } catch (e) { sum.failed++; sum.failures.push({ test: tc.name, error: e.message }); row.className = "suite-row suite-fail"; row.textContent = "[FAIL] " + tc.name + " — " + e.message; }
          });
        })(suites[i].tests[j]);
        (function run(k) {
          if (k >= q.length) {
            root.__suiteSummary = sum;
            var bar = document.getElementById("suite-summary-bar");
            bar.className = sum.failed === 0 ? "summary-bar summary-pass" : "summary-bar summary-fail";
            bar.textContent = sum.suite + ": " + sum.passed + "/" + sum.total + " passed (" + sum.failed + " failed)";
            return;
          }
          var out = q[k]();
          if (out && typeof out.then === "function") out.then(function () { run(k + 1); }, function () { run(k + 1); }); else run(k + 1);
        })(0);
      });
    }
  })(window);
  </script>

  <script>
  describe("14 - HTML5 Video Element Playback, Seeking & Alien Compositing", function () {
    it("exposes HTMLVideoElement attributes, canPlayType, textTracks, and DOM overlay layering", function () {
      var v = document.getElementById("vid-main");
      expect(typeof v.canPlayType).toBe("function");
      expect(v.canPlayType("video/mp4") !== "").toBe(true);
      expect(v.controls).toBe(true);
      expect(v.muted).toBe(true);
      expect(v.preload).toBe("auto");
      expect(v.poster).toContain("data:image/png;base64,");
      expect(v.textTracks.length).toBeGreaterThanOrEqual(1);

      var cs = getComputedStyle(v);
      expect(cs.objectFit).toBe("cover");
      expect(parseFloat(cs.borderTopLeftRadius)).toBe(14);

      var ov = document.getElementById("vid-controls-overlay");
      var ovR = ov.getBoundingClientRect();
      var hitOverlayPad = document.elementFromPoint(Math.round(ovR.left + 4), Math.round(ovR.top + 4));
      expect(hitOverlayPad).toBe(ov);
      var hitOverlayLabel = document.elementFromPoint(Math.round(ovR.left + 12), Math.round(ovR.top + 8));
      expect(hitOverlayLabel).toBe(ov.firstElementChild);
      expect(ov.contains(hitOverlayLabel)).toBe(true);
      var vR = v.getBoundingClientRect();
      expect(document.elementFromPoint(Math.round(vR.left + 20), Math.round(vR.top + 20))).toBe(v);
    });

    it("tracks synchronous volumechange, ratechange, and loop property mutations", function () {
      var v = document.getElementById("vid-main");
      var volChanges = 0, rateChanges = 0;
      v.addEventListener("volumechange", function () { volChanges++; });
      v.addEventListener("ratechange", function () { rateChanges++; });

      v.volume = 0.65;
      v.playbackRate = 1.5;
      v.loop = true;
      expect(v.volume).toBeCloseTo(0.65, 2);
      expect(v.playbackRate).toBeCloseTo(1.5, 2);
      expect(v.loop).toBe(true);
      v.playbackRate = 1.0;
      expect(volChanges >= 0 && rateChanges >= 0).toBe(true);
    });

    it("loads 128x96 metadata, plays, seeks, captures decoded frame onto Canvas2D, and parses WebVTT cues", function () {
      var v = document.getElementById("vid-main");
      if (typeof Promise === "undefined") {
        expect(v.tagName.toUpperCase()).toBe("VIDEO");
        return;
      }
      return new Promise(function (resolve, reject) {
        var timer = setTimeout(function () {
          reject(new Error("Video ready timeout (readyState=" + v.readyState + ", w=" + v.videoWidth + ", h=" + v.videoHeight + ")"));
        }, 4000);

        function onReady() {
          try {
            expect(v.videoWidth).toBe(128);
            expect(v.videoHeight).toBe(96);
            expect(v.duration).toBeGreaterThan(1.0);
            expect(v.readyState).toBeGreaterThanOrEqual(1);

            var p = v.play();
            var afterPlay = function () {
              v.pause();
              expect(v.paused).toBe(true);
              v.currentTime = 0.4;
              setTimeout(function () {
                try {
                  var c2 = document.getElementById("vid-capture-canvas");
                  var ctx = c2.getContext("2d");
                  ctx.drawImage(v, 0, 0, c2.width, c2.height);
                  var framePx = ctx.getImageData(0, 0, c2.width, c2.height).data;
                  var nonZero = false;
                  for (var i = 0; i < framePx.length; i += 4) {
                    if (framePx[i + 3] > 0 && (framePx[i] > 10 || framePx[i + 1] > 10 || framePx[i + 2] > 10)) {
                      nonZero = true;
                      break;
                    }
                  }
                  expect(nonZero).toBe(true);
                  var trk = v.textTracks && v.textTracks[0];
                  if (trk && trk.cues && trk.cues.length > 0) {
                    expect(trk.cues[0].text).toContain("Subtitle Cue 1");
                  }
                  clearTimeout(timer);
                  resolve();
                } catch (err) { clearTimeout(timer); reject(err); }
              }, 80);
            };
            if (p && typeof p.then === "function") p.then(afterPlay, function () { afterPlay(); });
            else afterPlay();
          } catch (err) { clearTimeout(timer); reject(err); }
        }

        if (v.readyState >= 2 && v.videoWidth > 0) onReady();
        else {
          v.addEventListener("canplay", onReady, { once: true });
          v.addEventListener("loadeddata", onReady, { once: true });
        }
      });
    });
  });
  </script>
