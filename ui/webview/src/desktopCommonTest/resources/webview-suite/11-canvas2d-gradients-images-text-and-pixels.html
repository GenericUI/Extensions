<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>11 - Canvas 2D Gradients, Images, Text, Compositing &amp; Alien Overlap</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    .summary-bar { padding: 10px 14px; border-radius: 8px; font-weight: 600; margin-bottom: 14px; background: #1e293b; border: 1px solid #334155; }
    .summary-pass { background: #052e16; border-color: #16a34a; color: #86efac; }
    .summary-fail { background: #450a0a; border-color: #dc2626; color: #fca5a5; }
    #test-stage { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    #canvas-host { position: relative; width: 320px; height: 180px; }
    #c2d-fx { border-radius: 14px; border: 2px solid #38bdf8; display: block; opacity: 0.96; }
    #dom-overlay-badge {
      position: absolute; right: 12px; bottom: 12px; z-index: 10;
      padding: 6px 10px; border-radius: 999px; background: rgba(239, 68, 68, 0.92); color: #fff; font-size: 12px; font-weight: 700;
    }
    #suite-results { display: flex; flex-direction: column; gap: 6px; }
    .suite-row { padding: 6px 10px; border-radius: 6px; font-family: monospace; font-size: 12px; background: #1e293b; }
    .suite-pass { border-left: 4px solid #22c55e; color: #bbf7d0; }
    .suite-fail { border-left: 4px solid #ef4444; color: #fecaca; }
  </style>
</head>
<body>
  <h1>11 &mdash; Canvas 2D Gradients, Patterns, Images, Text, Blend Modes &amp; Alien Overlap</h1>
  <div id="suite-summary-bar" class="summary-bar">Running test suite...</div>

  <main id="test-stage">
    <div id="canvas-host">
      <canvas id="c2d-fx" width="320" height="180"></canvas>
      <div id="dom-overlay-badge">Alien DOM Above Canvas</div>
    </div>
    <canvas id="c2d-offscreen" width="20" height="20"></canvas>
    <img id="img-src" width="4" height="4" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAHElEQVR4nGP4z8DwH4SRIJoAlP///38GMMYQAABmFiPdcWvxdAAAAABJRU5ErkJggg==" alt="4x4">
  </main>

  <section id="suite-results"></section>

  <script>
  (function (root) {
    var isStandalone = (typeof root.describe !== "function");
    var suites = [], activeSuite = null;
    function fv(v) { try { return JSON.stringify(v); } catch (e) { return String(v); } }
    function ext(m, a) {
      if (typeof m.toBeLessThanOrEqual !== "function") m.toBeLessThanOrEqual = function (n) { if (!(a <= n)) throw new Error("Expected " + a + " <= " + n); };
      if (typeof m.toBeCloseTo !== "function") m.toBeCloseTo = function (e, p) { var tol = Math.pow(10, -(typeof p === "number" ? p : 2)) / 2; if (Math.abs(a - e) >= tol) throw new Error("Expected " + a + " ~= " + e); };
      if (typeof m.toThrow !== "function") m.toThrow = function () { var ok = false; try { a(); } catch (e) { ok = true; } if (!ok) throw new Error("Expected throw"); };
      return m;
    }
    if (typeof root.expect === "function") { var oe = root.expect; root.expect = function (a) { return ext(oe(a), a); }; }
    else {
      root.expect = function (a) {
        return ext({
          toBe: function (e) { if (a !== e) throw new Error("Expected " + fv(e) + " got " + fv(a)); },
          toEqual: function (e) { if (fv(a) !== fv(e)) throw new Error("Expected " + fv(e) + " == " + fv(a)); },
          toBeTruthy: function () { if (!a) throw new Error("Expected truthy"); },
          toBeFalsy: function () { if (a) throw new Error("Expected falsy"); },
          toBeNull: function () { if (a != null) throw new Error("Expected null"); },
          toBeDefined: function () { if (a === undefined) throw new Error("Expected defined"); },
          toContain: function (i) { if (String(a).indexOf(String(i)) < 0) throw new Error("Expected contain " + i); },
          toBeGreaterThan: function (n) { if (!(a > n)) throw new Error("Expected " + a + " > " + n); },
          toBeGreaterThanOrEqual: function (n) { if (!(a >= n)) throw new Error("Expected " + a + " >= " + n); },
          toBeLessThan: function (n) { if (!(a < n)) throw new Error("Expected " + a + " < " + n); }
        }, a);
      };
    }
    if (isStandalone) {
      root.describe = function (n, fn) { var s = { name: n, tests: [] }; suites.push(s); activeSuite = s; fn(); activeSuite = null; };
      root.it = function (n, fn) { (activeSuite || suites[0]).tests.push({ name: n, fn: fn }); };
      root.test = root.it;
      root.addEventListener("load", function () {
        var c = document.getElementById("suite-results"), sum = { suite: document.title, total: 0, passed: 0, failed: 0, failures: [] };
        for (var i = 0; i < suites.length; i++) for (var j = 0; j < suites[i].tests.length; j++) {
          var tc = suites[i].tests[j]; sum.total++; var row = document.createElement("div"); c.appendChild(row);
          try { tc.fn(); sum.passed++; row.className = "suite-row suite-pass"; row.textContent = "[PASS] " + tc.name; }
          catch (e) { sum.failed++; sum.failures.push({ test: tc.name, error: e.message }); row.className = "suite-row suite-fail"; row.textContent = "[FAIL] " + tc.name + " — " + e.message; }
        }
        root.__suiteSummary = sum;
        var bar = document.getElementById("suite-summary-bar");
        bar.className = sum.failed === 0 ? "summary-bar summary-pass" : "summary-bar summary-fail";
        bar.textContent = sum.suite + ": " + sum.passed + "/" + sum.total + " passed (" + sum.failed + " failed)";
      });
    }
  })(window);

  function pxAt(ctx, x, y) {
    var d = ctx.getImageData(x, y, 1, 1).data;
    return [d[0], d[1], d[2], d[3]];
  }
  </script>

  <script>
  describe("11 - Canvas 2D Gradients, Patterns, Images, Text & Compositing", function () {
    it("renders linearGradient and radialGradient with interpolated color stops", function () {
      var ctx = document.getElementById("c2d-fx").getContext("2d");
      ctx.clearRect(0, 0, 320, 180);

      var lg = ctx.createLinearGradient(0, 0, 100, 0);
      lg.addColorStop(0, "rgb(255, 0, 0)");
      lg.addColorStop(1, "rgb(0, 0, 255)");
      ctx.fillStyle = lg;
      ctx.fillRect(0, 0, 100, 40);

      var left = pxAt(ctx, 2, 20);
      var mid = pxAt(ctx, 50, 20);
      var right = pxAt(ctx, 98, 20);
      expect(left[0]).toBeGreaterThan(220);
      expect(left[2]).toBeLessThan(35);
      expect(mid[0]).toBeGreaterThan(90);
      expect(mid[2]).toBeGreaterThan(90);
      expect(right[2]).toBeGreaterThan(220);

      var rg = ctx.createRadialGradient(140, 25, 2, 140, 25, 20);
      rg.addColorStop(0, "#00ff00");
      rg.addColorStop(1, "#000000");
      ctx.fillStyle = rg;
      ctx.fillRect(115, 5, 50, 40);
      expect(pxAt(ctx, 140, 25)[1]).toBeGreaterThan(200);
    });

    it("creates CanvasPattern from offscreen canvas and draws 3-arg, 5-arg, and 9-arg drawImage", function () {
      var off = document.getElementById("c2d-offscreen");
      var octx = off.getContext("2d");
      octx.fillStyle = "#ff0000"; octx.fillRect(0, 0, 10, 20);
      octx.fillStyle = "#00ff00"; octx.fillRect(10, 0, 10, 20);

      var ctx = document.getElementById("c2d-fx").getContext("2d");
      var pat = ctx.createPattern(off, "repeat");
      ctx.fillStyle = pat;
      ctx.fillRect(0, 50, 40, 20);
      expect(pxAt(ctx, 5, 60)).toEqual([255, 0, 0, 255]);
      expect(pxAt(ctx, 15, 60)).toEqual([0, 255, 0, 255]);
      expect(pxAt(ctx, 25, 60)).toEqual([255, 0, 0, 255]);

      // 3-arg drawImage
      ctx.drawImage(off, 180, 10);
      expect(pxAt(ctx, 184, 20)).toEqual([255, 0, 0, 255]);
      expect(pxAt(ctx, 194, 20)).toEqual([0, 255, 0, 255]);

      // 9-arg cropped drawImage from green right half -> destination red-free green
      ctx.drawImage(off, 10, 0, 10, 20, 210, 10, 30, 30);
      expect(pxAt(ctx, 225, 25)).toEqual([0, 255, 0, 255]);

      // <img> element -> drawImage when complete
      var img = document.getElementById("img-src");
      if (img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, 250, 10, 20, 20);
        expect(pxAt(ctx, 252, 12)[0]).toBeGreaterThan(200);
        expect(pxAt(ctx, 266, 26)[1]).toBeGreaterThan(200);
      }
    });

    it("supports fillText, strokeText, measureText, globalAlpha, globalCompositeOperation & shadows", function () {
      var ctx = document.getElementById("c2d-fx").getContext("2d");
      ctx.font = "bold 16px sans-serif";
      var shortM = ctx.measureText("Hi");
      var longM = ctx.measureText("Hello GenericUI");
      expect(shortM.width).toBeGreaterThan(4);
      expect(longM.width).toBeGreaterThan(shortM.width);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 2;
      ctx.fillText("Canvas2D Text", 10, 105);
      ctx.shadowBlur = 0; ctx.shadowOffsetX = 0;

      // globalAlpha blending over opaque black vs pure color
      ctx.clearRect(60, 50, 60, 40);
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "#ff0000";
      ctx.fillRect(65, 55, 30, 30);
      ctx.restore();
      var ga = pxAt(ctx, 80, 70);
      expect(ga[0]).toBe(255);
      expect(ga[3]).toBeGreaterThan(110);
      expect(ga[3]).toBeLessThan(145);

      // destination-over places new blue BEHIND existing opaque green at (125, 65)
      ctx.clearRect(120, 50, 40, 40);
      ctx.fillStyle = "#00ff00";
      ctx.fillRect(120, 50, 40, 40);
      ctx.save();
      ctx.globalCompositeOperation = "destination-over";
      ctx.fillStyle = "#0000ff";
      ctx.fillRect(120, 50, 40, 40);
      ctx.restore();
      expect(pxAt(ctx, 140, 70)).toEqual([0, 255, 0, 255]);

      // lighter (additive)
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "#ff0000";
      ctx.fillRect(120, 50, 40, 40);
      ctx.restore();
      expect(pxAt(ctx, 140, 70)).toEqual([255, 255, 0, 255]);
    });

    it("supports createImageData, putImageData dirty rect, toDataURL, and overlapping DOM compositing", function () {
      var cv = document.getElementById("c2d-fx");
      var ctx = cv.getContext("2d");
      var imgData = ctx.createImageData(12, 12);
      for (var i = 0; i < imgData.data.length; i += 4) {
        imgData.data[i] = 12;
        imgData.data[i + 1] = 34;
        imgData.data[i + 2] = 56;
        imgData.data[i + 3] = 255;
      }
      ctx.putImageData(imgData, 10, 120);
      expect(pxAt(ctx, 15, 125)).toEqual([12, 34, 56, 255]);

      var pngUrl = cv.toDataURL("image/png");
      expect(pngUrl.indexOf("data:image/png;base64,")).toBe(0);
      expect(pngUrl.length).toBeGreaterThan(64);

      var hostR = cv.getBoundingClientRect();
      var badge = document.getElementById("dom-overlay-badge");
      var badgeR = badge.getBoundingClientRect();
      expect(badgeR.left).toBeGreaterThan(hostR.left);
      expect(badgeR.right).toBeLessThan(hostR.right);
      expect(document.elementFromPoint(Math.round(badgeR.left + 8), Math.round(badgeR.top + 8))).toBe(badge);
    });
  });
  </script>
</body>
</html>
